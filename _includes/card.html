{%- assign m = include.m -%}
{%- if m.semestre == "extra" -%}
  {%- assign tipo = "extra" -%}
{%- else -%}
  {%- assign tipo = m.semestre | append: "° Semestre" -%}
{%- endif -%}
<a href="{{ m.url | relative_url }}"
   data-card data-anno="{{ m.anno }}" data-title="{{ m.title | downcase | escape }}" data-date="{{ m.aggiornamento }}"
   class="{% if m.anno != include.current %}hidden {% endif %}relative w-full h-96 flex flex-col border-2 dark:border-zinc-700 border-zinc-400 dark:hover:border-zinc-500 hover:border-zinc-600 transition-all duration-300 rounded-lg cursor-pointer">

  <div data-new class="hidden absolute rounded-full bg-red-500 w-2.5 h-2.5 -top-1 -right-1 z-10"></div>
  <div data-new class="hidden absolute rounded-full bg-red-500 w-2.5 h-2.5 -top-1 -right-1 z-10 animate-ping"></div>

  <div class="h-4/6 dark:bg-zinc-900/20 bg-zinc-20/20 w-full border-0 rounded-t-md flex justify-center items-center backdrop-blur-sm">
    <img alt="{{ m.title | escape }}" width="128" height="128" loading="lazy" src="{{ m.immagine }}" class="w-32 h-32 border-0 rounded-lg shadow-2xl dark:shadow-zinc-950 shadow-zinc-500">
  </div>

  <div class="w-full dark:bg-neutral-950 bg-neutral-300 h-2/6 border-0 rounded-b-md px-5 py-3 flex flex-col justify-between items-start">
    <div>
      <div>
        <h2 class="dark:text-white text-black min-h-7 font-semibold text-lg">{{ m.title }}</h2>
      </div>
      <div class="relative flex flex-row gap-1">
        {% for c in m.corso %}
        <div class="text-stone-700 dark:text-stone-500 text-xs rounded-full px-2 py-px text-center font-semibold border border-stone-700 dark:border-stone-500">{{ c }}</div>
        {% endfor %}
      </div>
    </div>

    <div class="flex flex-row w-full justify-between items-center">
      <div class="flex flex-row justify-start items-center">
        <div class="dark:bg-zinc-100 bg-zinc-900 dark:text-black text-white rounded-full px-2 py-px font-medium">
          <p class="text-[12px]">{{ tipo }}</p>
        </div>
      </div>
      <div class="dark:text-white/65 text-black/70 text-xs">Aggiornato <span data-ago>{{ m.aggiornamento | date: "%d/%m/%Y" }}</span></div>
    </div>
  </div>
</a>
