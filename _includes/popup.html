{%- comment -%} Avviso cambio dominio: attivalo da _config.yml (legacy_notice). {%- endcomment -%}
<div id="legacy-popup" data-old="{{ site.legacy_notice.old_origin }}" data-new="{{ site.legacy_notice.new_origin }}" class="h-screen w-screen fixed z-[70] hidden items-center justify-center">
  <div class="flex flex-col gap-3 px-8 py-10 items-center justify-center popup w-fit h-fit min-h-24 bg-neutral-900/20 dark:bg-neutral-900/20 backdrop-blur-xl rounded-xl text-white relative">
    <button type="button" data-popup-close aria-label="Chiudi" class="absolute top-2 right-2 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
    </button>
    <p class="text-xl uppercase font-semibold">Nuovo Link 👇</p>
    <a href="{{ site.legacy_notice.new_origin }}/" class="underline text-blue-700 dark:text-blue-400">{{ site.legacy_notice.new_origin | remove: "https://" | remove: "http://" }}</a>
  </div>
</div>
