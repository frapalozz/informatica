# ─────────────────────────────────────────────────────────────
#  Bit, l'assistente del sito (assets/js/assistente.js)
#  Niente AI: risponde con le materie in _materie/ e con questo file.
#  Si attiva e si rinomina da _config.yml → assistente.
# ─────────────────────────────────────────────────────────────

# Pulsanti suggeriti all'apertura della chat (testo = domanda inviata).
suggerimenti:
  - "Prove passate di Algoritmi"
  - "Materie del 1° anno"
  - "Registrazioni di Sistemi Operativi"
  - "Come aggiungo una risorsa?"

# Altri nomi con cui gli studenti chiamano le materie.
# Chiave = nome del file in _materie/ (senza .md). Le sigle di 2 lettere
# valgono solo se scritte da sole o in maiuscolo (es. "SO", "BD").
alias:
  Algoritmi_e_Strutture: ["asd", "algoritmi", "algo"]
  Sistemi_Operativi: ["so", "sistemi"]
  Basi_di_Dati: ["bd", "database", "data base", "db", "sql"]
  Architettura_Elaboratori: ["architettura", "arch"]
  Internet_Reti_Sicurezza: ["reti", "rete", "sicurezza", "networking"]
  Ignegneria_del_Software: ["ingegneria", "ids", "software engineering"]
  Linguaggi_e_Compilatori: ["compilatori", "linguaggi"]
  Matematica_discreta: ["discreta"]
  Matematica_logica: ["logica"]
  Metodologie_di_Programmazione: ["mdp", "metodologie"]
  Paradigmi_Avanzati_di_Programmazione: ["pap", "paradigmi"]
  Probabilita_e_Statistica: ["probabilita", "statistica"]
  Programmazione: ["prog"]
  Ricerca_Operativa: ["ro", "ricerca operativa"]
  Fondamenti_Informatica: ["fondamenti"]
  Diritto_Prodotti_Digitali: ["diritto"]
  Machine_Learning: ["ml"]
  Multiagent_System_Lab: ["mas", "multiagent"]
  Agent_Based_Adaptive_Modelling: ["abam", "agent based"]
  Complex_System_Design: ["csd", "complex systems"]

# Messaggio sui collaboratori (i contributori del repository su GitHub, presi in automatico).
# Bit lo dice da solo tra le battute (più spesso di ciascuna: circa una volta su 5-6)
# e quando gli si chiede "chi ha collaborato?".
collaborazione: "Queste persone hanno collaborato al progetto per aiutarci tra di noi. Perché non collabori anche tu? 🥹"

# Domande frequenti. Bit risponde quando la domanda contiene una delle frasi
# in `domande` (maiuscole e accenti non contano).
# Nei link si possono usare: @whatsapp, @telegram, @whiteboard, @donazione, @autore
# oppure un percorso del sito (es. /risorsa/) o un indirizzo completo.
faq:
  - domande: ["aggiungere una risorsa", "aggiungo una risorsa", "aggiungere risorsa", "aggiungo risorsa", "caricare appunti", "carico appunti", "contribuire", "link rotto", "link non funziona", "segnalare", "manca"]
    risposta: "Puoi proporre appunti, link o prove dal modulo «Aggiungi risorsa». Arriva direttamente a chi gestisce il sito."
    link:
      - label: "Aggiungi risorsa"
        url: "/risorsa/"

  - domande: ["chi ha collaborato", "collaboratori", "contributori", "chi ha contribuito", "chi ha aiutato", "ringraziamenti", "come posso collaborare", "come collaborare", "come posso contribuire"]
    collaboratori: true   # mostra il messaggio "collaborazione" con l'elenco dei collaboratori

  - domande: ["whatsapp", "telegram", "gruppo", "gruppi", "chat degli studenti"]
    risposta: "Ci sono i gruppi degli studenti, dove puoi chiedere a chi ha già dato l'esame."
    link:
      - label: "Gruppo WhatsApp"
        url: "@whatsapp"
      - label: "Gruppo Telegram"
        url: "@telegram"

  - domande: ["whiteboard", "lavagna"]
    risposta: "C'è una lavagna online condivisa: utile per risolvere esercizi insieme."
    link:
      - label: "Apri la Whiteboard"
        url: "@whiteboard"

  - domande: ["donazione", "donare", "offrire un caffe", "supportare il sito", "sostenere il sito", "paypal"]
    risposta: "Il sito è gratuito. Se ti è stato utile, puoi offrire un caffè a chi lo gestisce."
    link:
      - label: "Offri un caffè"
        url: "@donazione"

  - domande: ["chi ha fatto", "chi gestisce", "chi ha creato", "autore", "contattare", "contatti"]
    risposta: "Il sito è curato da Palozz, insieme agli studenti che segnalano le risorse."
    link:
      - label: "palozz.com"
        url: "@autore"

  - domande: ["extra", "corsi online", "roadmap", "risorse esterne"]
    risposta: "Nella sezione Extra ci sono corsi e guide gratuite che non fanno parte del piano di studi."
    link:
      - label: "Extra di Informatica"
        url: "/informatica/extra/"

  - domande: ["cosa sai fare", "come funzioni", "aiuto", "help", "chi sei"]
    risposta: "Sono Bit, il gatto del sito. Chiedimi una materia e cosa ti serve, per esempio «prove di algoritmi» o «registrazioni SO», e ti porto dove trovarlo."

  - domande: ["ciao", "buongiorno", "buonasera", "salve", "hey"]
    risposta: "Ciao! Di quale materia ti serve qualcosa?"

  - domande: ["grazie", "perfetto", "ottimo"]
    risposta: "Di niente! Se ti serve altro sono qui."

# Battute: Bit dice una di queste frasi da solo, in un fumetto che sparisce dopo 5 s:
# la prima appena si entra, la seconda dopo 30 s, poi ogni 45-60 s
# (si spengono con assistente.chiacchiere: false in _config.yml).
# Metà delle volte sceglie tra quelle del momento della giornata
# (notte 23-6, mattina 6-12, pranzo 12-14, pomeriggio 14-18, sera 18-23),
# altrimenti tra quelle di "sempre". Si possono usare {ora}, {nome} e {materia}.
battute:
  sempre:
    - "Ho provato a fare il merge con il mio pisolino. Conflitto."
    - "Un gatto non ha bug. Ha funzionalità non documentate."
    - "Ho trovato un bug. L'ho mangiato."
    - "Il mio linguaggio preferito? Il MIAOssembly."
    - "Vorrei imparare Python, ma i serpenti mi mettono ansia."
    - "Sto facendo debug di questa pagina. Spoiler: è tutto a posto."
    - "Ctrl+Z funziona anche nella vita? Chiedo per un amico."
    - "Se ti serve qualcosa, miao. Cioè: chiedi pure."
    - "Le prove passate sono il miglior amico dello studente. Dopo di me, ovviamente."
    - "Ricordati di fare una pausa. Io ne faccio sedici al giorno."
    - "Ho chiesto a una paperella di gomma di spiegarmi la ricorsione. Mi ha rimandato a me stesso."
    - "Sono in modalità risparmio energetico. Si chiama anche: gatto."
    - "while (studi) { ce_la_fai++; }"
    - "Mi hanno detto di stare fuori dalla tastiera. Non ho capito perché."
    - "Il mio editor preferito? Quello con più tasti da calpestare."
    - "Ho chiuso Vim. Ci ho messo solo tre giorni."
    - "Tab o spazi? Io dormo sopra entrambi."
    - "Ho fatto git push --force sul divano. Ora è mio."
    - "Le mie sette vite? Sono solo backup fatti bene."
    - "404: croccantini non trovati."
    - "Tu vedi un muro di testo. Io vedo un posto comodo dove sedermi."
    - "Un gomitolo è solo una lista concatenata molto aggrovigliata."
    - "Se qualcosa non va, spegni e riaccendi. Con me funziona: si chiama pisolino."
    - "Sto ottimizzando il mio algoritmo di caccia: O(1) per il puntino laser."
    - "Il mio stack preferito? Una pila di libri su cui dormire."
    - "Ho scritto un commento nel codice: «miao». Spiega tutto."
    - "Le pause servono: anche il garbage collector ogni tanto si ferma a fare pulizia."
    - "Spiegare un esercizio ad alta voce aiuta a capirlo. Funziona anche con un gatto."
    - "Sono multitasking: dormo e sogno contemporaneamente."
    - "Ho provato il pair programming. Il mio collega si è lamentato del pelo sulla tastiera."
    - "Fare commit spesso è una buona abitudine. Anche fare merenda spesso."
    - "La documentazione la leggo sempre. Di solito ci dormo sopra."
    - "Il mio IDE si chiama «cuscino». Ha un ottimo autocompletamento: zzz."
    - "Se il codice funziona al primo colpo, ricontrolla. Io ricontrollo sempre la ciotola."
    - "Un bit vale 0 o 1. Io, {nome}, valgo sempre 1: sono unico."
    - "Ho imparato il binario: 1 croccantino, 10 croccantini, 11 croccantini... non bastano mai."
    - "Il modo migliore per trovare un errore? Mostrare il codice a qualcun altro. Anche a me."
    - "Ricordati di salvare. Io salvo tutto, soprattutto i calzini."
    - "Sono un gatto full stack: salto sullo scaffale in alto e su quello in basso."
    - "L'esame più difficile è quello che non hai ancora iniziato a preparare. Coraggio!"
    - "Un passo alla volta, come un ciclo for."
    - "Bloccato su un esercizio? Passa al prossimo e torna dopo. Funziona anche con le scatole."
    - "Chiudere l'ultima parentesi dà una soddisfazione enorme. Come una scatola della misura giusta."
    - "Il mio framework preferito? Il davanzale: stabile, caldo, con vista."
    - "I gatti possono dormire anche 16 ore al giorno. Io punto al record."
    - "Ho fatto un fork del tuo pisolino. Ora ne abbiamo due."
    - "Il codice più pulito è quello ben commentato. Il mio pelo, invece, è ovunque."
    - "Ho scritto un algoritmo di ordinamento: ho messo i croccantini in fila e li ho mangiati."
    - "La mia complessità preferita? O(nanna)."
    - "Nel 1947 trovarono una falena dentro un computer: il primo «bug» documentato. Lavoro da gatto."
    - "Nomi di variabili chiari sono un regalo per il te del futuro."
    - "Ogni esperto è stato un principiante. Anche io, una volta, cadevo dal divano."
    - "Non sono pigro: sono in attesa di un evento."
    - "Il mio stato preferito? IDLE."
    - "Ho la coda, ma non è una FIFO."
    - "Gli array partono da zero. Anche la mia voglia di fare, prima del pisolino."
    - "Sto implementando la funzione «coccole». Manca solo l'input."
    - "Il mio modello linguistico preferito? Il miagolio."
    - "Il segreto per studiare bene? Pause, acqua e un gatto da guardare."
    - "Tranquillo: anche i senior cercano su internet come si centra un div."
    - "Ho progettato un'interfaccia: si chiama ciotola. Due stati: piena o vuota."
    - "Ho trovato un ciclo infinito: rincorrere la mia coda."
    - "La differenza tra me e un server? Io non vado giù. Mi sdraio."
    - "Errore 418: sono una teiera? No, sono un gatto."
    - "Il miglior debugger? Un paio d'occhi freschi dopo una pausa."
    - "Ogni esercizio sbagliato ti insegna qualcosa. Ogni vaso rotto, a me, no."
    - "Ho imparato SQL: SELECT * FROM croccantini WHERE ciotola = 'mia';"
    - "Ho un debole per i puntatori. Soprattutto quelli laser."
    - "La mia memoria è come la RAM: se mi spegni dimentico tutto. Tranne la cena."
    - "Un po' ogni giorno batte una maratona la sera prima. Fidati del gatto."
    - "Il mio ruolo nel team? Controllo qualità delle scatole di cartone."
    - "Ho fatto refactoring del divano: ora tutti i cuscini sono miei."
    - "La mia lista di cose da fare: dormire, mangiare, dormire. Tutto completato."
    - "Leggere il messaggio d'errore fino in fondo risolve metà dei problemi. L'altra metà, un pisolino."
  mattina:
    - "Buongiorno! Io ho già fatto tre pisolini, tu il caffè?"
    - "Mattinata produttiva? Io ho già spinto una penna giù dal tavolo."
    - "Buongiorno! Il primo commit della giornata è il caffè."
    - "Sveglia presto? Anche io: mi sono svegliato per tornare a dormire."
    - "Le {ora}: ora perfetta per ripassare qualcosa di leggero."
    - "Di mattina il cervello compila più veloce. Approfittane!"
    - "Colazione fatta? Io ho già chiesto la seconda."
    - "Lezione alle 9? Coraggio, il primo caffè fa miracoli."
    - "Buongiorno! Oggi è un buon giorno per capire finalmente quell'esercizio."
    - "Il sole è alto, il gatto è sveglio (più o meno): la giornata può iniziare."
    - "Mattina tranquilla: perfetta per mettere in ordine gli appunti."
    - "Studiare a stomaco vuoto è come compilare senza librerie. Prima la colazione!"
    - "La prima ora di studio è la più difficile da iniziare e la più facile da continuare."
    - "Buongiorno! Ho già controllato: il sito funziona. Puoi cominciare."
    - "Buongiorno! Ho già fatto il deploy della colazione."
    - "Mattina presto, mente fresca: il momento giusto per gli argomenti difficili."
    - "Le {ora} e sei già qui? Ti meriti un croccantino. Metaforico."
    - "Buongiorno! Oggi provo a stare sveglio fino a pranzo. Forse."
    - "Il mattino ha l'oro in bocca. Io preferisco il tonno."
    - "Prima di iniziare, scrivi tre cose da fare oggi. Io ho scritto «dormire» tre volte."
    - "La luce del mattino è perfetta per un pisolino al sole. E per studiare, dai."
    - "In aula o a casa? In ogni caso, buongiorno da {nome}!"
    - "Le {ora}: il caffè fa effetto? Il mio latte, purtroppo, no."
    - "Comincia dall'esercizio più semplice: scalda il motore."
    - "Buongiorno! Oggi ho deciso di essere produttivo: ho spostato una matita."
    - "Mattina fresca, idee fresche. Le mie riguardano tutte la colazione."
  pranzo:
    - "È ora di pranzo! Io ho già prenotato la mia ciotola."
    - "Pausa pranzo: il cervello va in standby, la pancia in esecuzione."
    - "Studiare a pancia vuota? Sconsigliato da nove gatti su dieci."
    - "Le {ora}: profumo di pasta. O sono solo io che ho fame?"
    - "Dopo pranzo arriva l'abbiocco. Io la chiamo «modalità gatto»."
    - "Pranzo veloce e poi si riparte? Ricordati almeno di masticare."
    - "Se mangi alla scrivania, occhio alle briciole nella tastiera. Le ho controllate io."
    - "Un buon pranzo vale quanto un buon ripasso. Forse di più."
    - "Le {ora}: in mensa o a casa? Io mangio dove capita."
    - "Pausa pranzo meritata. Gli algoritmi possono aspettare mezz'ora."
    - "Il pranzo è il punto di salvataggio della giornata."
    - "Oggi cosa si mangia? Spero qualcosa che cade dal tavolo."
    - "Dopo mangiato due passi aiutano. Io ne faccio due fino al cuscino."
    - "Pranzo + sole + divano = pisolino garantito. La formula non sbaglia mai."
    - "Ricarica le batterie: il pomeriggio è lungo."
    - "A pranzo niente schermi: il cervello ringrazia. Poi però torna da me."
    - "Hai fame? Anche io. Io ho sempre fame."
