    - "Studio di gruppo? Spiegare agli altri è il modo migliore per imparare."
    - "Quasi sera: ancora un piccolo sforzo!"
    - "Pomeriggio noioso? Prova un esercizio d'esame vero: ti svegli subito."
    - "Ho appena finito il terzo pisolino del pomeriggio. Tu a che esercizio sei?"
  sera:
