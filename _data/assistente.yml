    - "Sera tranquilla: il momento giusto per rivedere gli appunti di oggi."
    - "Hai studiato tanto oggi. Domani il tuo cervello ti ringrazierà."
    - "Le {ora}: chiudi l'argomento di oggi, così domani riparti leggero."
    - "Stasera serie TV o capitolo da finire? Io voto pisolino."
