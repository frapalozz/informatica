    - "Pomeriggio produttivo? Io ho già cambiato posto tre volte."
    - "Se gli occhi si chiudono, non è colpa dell'argomento. È il pomeriggio."
    - "Merenda! Gli esercizi vengono meglio con qualcosa nello stomaco."
    - "Un'altra ora di studio e poi una passeggiata. Io la faccio sul davanzale."
    - "Pomeriggio lungo? Dividi lo studio in blocchi da 25 minuti. Io lo divido in pisolini."
    - "Il sole si è spostato: devo spostare anche il mio pisolino nel punto più caldo."
    - "Le {ora}: ancora un esercizio e poi ti meriti un premio."
    - "Lezioni finite? Ripassare lo stesso giorno aiuta a ricordare."
    - "Pomeriggio tranquillo qui sul sito. Perfetto per concentrarsi."
    - "Le {ora}: per me è l'ora del pisolino pomeridiano. E per te?"
